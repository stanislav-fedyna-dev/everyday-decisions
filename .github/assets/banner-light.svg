<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>everyday-decisions — Decide, don't dither.</title>
  <rect x="1" y="1" width="1278" height="358" rx="18" fill="#FAFAF7" stroke="#E6E4DD" stroke-width="2"/>
  <text x="72" y="112" font-size="15" font-weight="600" letter-spacing="3" fill="#6A6F7A">AGENT SKILL</text>
  <text x="70" y="178" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#16181D">everyday-decisions</text>
  <text x="72" y="228" font-size="30" font-weight="600" fill="#0E8F63">Decide, don&#8217;t dither.</text>
  <text x="72" y="276" font-size="18" fill="#6A6F7A">One firm answer for everyday choices,</text>
  <text x="72" y="302" font-size="18" fill="#6A6F7A">with the trade-off named and a reason to revisit.</text>
  
  <rect x="760" y="98" width="170" height="40" rx="20" fill="none" stroke="#6A6F7A" stroke-width="1.5">
    <animate attributeName="stroke" from="#6A6F7A" to="#C9CCD2" begin="1.5s" dur="0.4s" fill="freeze"/>
  </rect>
  <text x="845" y="124" text-anchor="middle" font-size="17" fill="#16181D" font-weight="500">Option A
    <animate attributeName="fill" from="#16181D" to="#6A6F7A" begin="1.5s" dur="0.4s" fill="freeze"/>
  </text>
  <path d="M930,118 C980,118 980,180 1030,180" fill="none" stroke="#6A6F7A" stroke-width="1.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.3s" dur="0.6s" fill="freeze"/>
    <animate attributeName="stroke" from="#6A6F7A" to="#C9CCD2" begin="1.5s" dur="0.4s" fill="freeze"/>
  </path>
  <rect x="760" y="160" width="170" height="40" rx="20" fill="none" stroke="#6A6F7A" stroke-width="1.5">
    <animate attributeName="stroke" from="#6A6F7A" to="#0E8F63" begin="1.5s" dur="0.4s" fill="freeze"/>
  </rect>
  <text x="845" y="186" text-anchor="middle" font-size="17" fill="#16181D" font-weight="600">Option B
    <animate attributeName="fill" from="#16181D" to="#16181D" begin="1.5s" dur="0.4s" fill="freeze"/>
  </text>
  <path d="M930,180 C980,180 980,180 1030,180" fill="none" stroke="#6A6F7A" stroke-width="2.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.55s" dur="0.6s" fill="freeze"/>
    <animate attributeName="stroke" from="#6A6F7A" to="#0E8F63" begin="1.5s" dur="0.4s" fill="freeze"/>
  </path>
  <rect x="760" y="222" width="170" height="40" rx="20" fill="none" stroke="#6A6F7A" stroke-width="1.5">
    <animate attributeName="stroke" from="#6A6F7A" to="#C9CCD2" begin="1.5s" dur="0.4s" fill="freeze"/>
  </rect>
  <text x="845" y="248" text-anchor="middle" font-size="17" fill="#16181D" font-weight="500">Don&#8217;t buy
    <animate attributeName="fill" from="#16181D" to="#6A6F7A" begin="1.5s" dur="0.4s" fill="freeze"/>
  </text>
  <path d="M930,242 C980,242 980,180 1030,180" fill="none" stroke="#6A6F7A" stroke-width="1.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.8s" dur="0.6s" fill="freeze"/>
    <animate attributeName="stroke" from="#6A6F7A" to="#C9CCD2" begin="1.5s" dur="0.4s" fill="freeze"/>
  </path>
  
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
    <rect x="1030" y="156" width="190" height="48" rx="24" fill="#0E8F63"/>
    <path d="M1054,180 l7,7 l13,-14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1088" y="186" font-size="18" font-weight="700" fill="#FFFFFF">Go with B</text>
  </g>
</svg>
