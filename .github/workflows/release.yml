name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package skill
        run: cd skills && zip -r ../everyday-decisions.zip everyday-decisions
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" everyday-decisions.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
